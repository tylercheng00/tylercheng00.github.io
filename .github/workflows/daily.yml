name: Daily insight

# Every morning in Hong Kong, publish five Insights articles straight to main.
# No pull request.
# 1. Take up to five notes in content/daily dated today or earlier.
# 2. If that is fewer than five, draft the rest with Claude and publish them,
#    if the ANTHROPIC_API_KEY secret is set. Otherwise publish whatever was due.

on:
  schedule:
    - cron: "15 0 * * *"   # 08:15 Asia/Hong_Kong
  workflow_dispatch:
    inputs:
      date:
        description: "Publish queued notes due on or before this date (YYYY-MM-DD). Empty = today in Hong Kong."
        required: false
        type: string
      topic:
        description: "Optional topic, used only when the queue is empty and a new note is drafted."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due notes and rebuild
        env:
          AS_OF: ${{ github.event.inputs.date }}
          TOPIC: ${{ github.event.inputs.topic }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$AS_OF" ]; then
            python3 tools/publish_daily.py --date "$AS_OF" | tee /tmp/publish-daily.txt
          else
            python3 tools/publish_daily.py | tee /tmp/publish-daily.txt
          fi
          n=$(sed -n 's/^published=//p' /tmp/publish-daily.txt | tail -1)
          n=${n:-0}
          need=$((5 - n))
          if [ "$need" -le 0 ]; then
            :
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Published $n from the queue. ANTHROPIC_API_KEY is not set, so no drafts."
            if [ "$n" -eq 0 ]; then
              exit 0
            fi
          else
            pip install --quiet anthropic
            i=0
            while [ "$i" -lt "$need" ]; do
              if [ -n "$TOPIC" ] && [ "$i" -eq 0 ]; then
                python3 tools/draft_article.py --topic "$TOPIC"
              else
                python3 tools/draft_article.py
              fi
              i=$((i + 1))
            done
          fi
          python3 tools/build_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/insights content/daily insights index.html sitemap.xml
          git commit -m "insights: daily note"
          git pull --rebase origin main
          git push
