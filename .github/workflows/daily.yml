name: Daily insight

# Every morning in Hong Kong, publish one Insights article straight to main.
# No pull request.
# 1. If content/daily has a note dated today or earlier, publish that.
# 2. When the queue is empty, draft the next note with Claude and publish it,
#    if the ANTHROPIC_API_KEY secret is set. Otherwise stop quietly.

on:
  schedule:
    - cron: "15 0 * * *"   # 08:15 Asia/Hong_Kong
  workflow_dispatch:
    inputs:
      date:
        description: "Publish queued notes due on or before this date (YYYY-MM-DD). Empty = today in Hong Kong."
        required: false
        type: string
      topic:
        description: "Optional topic, used only when the queue is empty and a new note is drafted."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due notes and rebuild
        env:
          AS_OF: ${{ github.event.inputs.date }}
          TOPIC: ${{ github.event.inputs.topic }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$AS_OF" ]; then
            python3 tools/publish_daily.py --date "$AS_OF"
          else
            python3 tools/publish_daily.py
          fi
          if [ -z "$(git status --porcelain content/insights content/daily sitemap.xml)" ]; then
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "Queue empty and ANTHROPIC_API_KEY is not set; nothing to publish."
              exit 0
            fi
            pip install --quiet anthropic
            if [ -n "$TOPIC" ]; then
              python3 tools/draft_article.py --topic "$TOPIC"
            else
              python3 tools/draft_article.py
            fi
          fi
          python3 tools/build_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/insights content/daily insights index.html sitemap.xml
          git commit -m "insights: daily note"
          git pull --rebase origin main
          git push
