name: Fetch hero photo candidates (temporary)
on:
  push:
    branches: [claude/sweet-bohr-ys06zm]
    paths: [tools/fetch_commons.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_commons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _img-candidates
          git commit -m "Hero photo candidates from Wikimedia Commons (temporary)" || exit 0
          git push
