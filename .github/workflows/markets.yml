name: Update market snapshot

on:
  schedule:
    # About every 30 minutes while US markets are open (13:30-20:00 UTC,
    # Mon-Fri), plus one run after the close.
    - cron: "7,37 13-20 * * 1-5"
    - cron: "23 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch snapshot
        run: python3 tools/fetch_markets.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/markets.json)" ]; then
            echo "No changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          git commit -m "markets: update snapshot"
          git pull --rebase origin main
          git push
