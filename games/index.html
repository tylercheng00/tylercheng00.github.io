<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戲 Games｜Tyler Cheng</title>
  <meta name="description" content="Tyler Cheng 嘅網頁小遊戲合集。">
  <meta name="theme-color" content="#0f1b2d">
  <style>
    :root { --bg: #0f1b2d; --panel: #16263d; --line: #2c4467; --text: #eaf2ff; --muted: #9db0cc; --accent: #4fd1a5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at top, #1d3a63, var(--bg) 60%); color: var(--text); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; min-height: 100vh; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
    a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
    a.back:hover { color: var(--text); }
    h1 { font-size: clamp(28px, 5vw, 40px); margin: 18px 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .game { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
    .game:hover, .game:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
    .art { height: 150px; display: flex; align-items: center; justify-content: center; font-size: 64px; background: linear-gradient(135deg, #22406b, #1a2c48); }
    .info { padding: 14px 16px 16px; }
    .info h2 { margin: 0 0 4px; font-size: 20px; }
    .info p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .tag { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700; color: #062018; background: var(--accent); border-radius: 999px; padding: 2px 10px; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../">← 返回主頁</a>
    <h1>🎮 遊戲 Games</h1>
    <p class="sub">網頁小遊戲合集——直接喺瀏覽器玩，電腦同手機都得。</p>
    <div class="grid">
      <a class="game" href="alchemy-lab-x/">
        <div class="art">⚗️🧑‍🔬</div>
        <div class="info">
          <h2>Alchemy Lab X 化學實驗室</h2>
          <p>扮演實驗室學生：攞試劑、倒燒杯、用本生燈加熱、測試氣體，親眼睇住反應發生。收集超過 200 個化學反應！</p>
          <span class="tag">化學 · 模擬</span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
