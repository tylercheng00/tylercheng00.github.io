plugins { id "com.android.application" }

// Release signing: the upload key is kept outside the repository.
// Put its details in android/keystore.properties (git-ignored):
//   storeFile=/path/to/upload-key.jks  storePassword=…  keyAlias=upload  keyPassword=…
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "io.github.tylercheng00.readiness"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.tylercheng00.readiness"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
