<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTRDCC 生物科技園區</title>
<meta name="description" content="BTRDCC 生物科技園區 3D 等距鳥瞰模型：由研發、共享實驗、中試生產、農業試驗到技術轉移與創投的一站式園區。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0F2A2E;
    --green: #17775A;
    --gold: #E0A43A;
    --paper: #F4EFE4;
    --surface: #FBF8F2;
    --surface-2: #F1EBDF;
    --ink: #0F2A2E;
    --ink-2: #3c5558;
    --muted: #6b7f80;
    --line: rgba(15, 42, 46, 0.12);
    --hud: rgba(251, 248, 242, 0.94);
    --shadow: 0 6px 24px rgba(15, 42, 46, 0.10);
    --panel-w: 400px;
    --font: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  body.night {
    --paper: #0a1719;
    --surface: #0f2326;
    --surface-2: #142d31;
    --ink: #EEE7D8;
    --ink-2: #c9d3cf;
    --muted: #93a8a7;
    --line: rgba(224, 164, 58, 0.18);
    --hud: rgba(15, 35, 38, 0.92);
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    transition: background .6s, color .6s;
  }
  button { font: inherit; color: inherit; }

  /* ---------------- Side panel ---------------- */
  #panel {
    order: 0;
    width: var(--panel-w); flex: 0 0 var(--panel-w);
    height: 100%;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--line);
    z-index: 20;
    transition: background .6s;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 22px 16px;
    background: var(--teal); color: #F4EFE4;
    flex: 0 0 auto;
  }
  .brand svg { width: 38px; height: 38px; flex: 0 0 auto; }
  .brand .t1 { font-size: 19px; font-weight: 700; letter-spacing: .08em; color: var(--gold); line-height: 1.1; }
  .brand .t2 { font-size: 12.5px; opacity: .85; margin-top: 3px; letter-spacing: .04em; }
  .brand .sheet-toggle { display: none; margin-left: auto; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #F4EFE4; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #panelBody { flex: 1 1 auto; overflow-y: auto; padding: 0 22px 28px; scrollbar-width: thin; }

  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin: 24px 0 8px; }
  body.night .eyebrow { color: var(--gold); }
  h2.sec { font-size: 15px; margin: 0 0 10px; font-weight: 700; }
  p.lead { font-size: 14px; line-height: 1.75; color: var(--ink-2); margin: 0; }
  p.body { font-size: 13.5px; line-height: 1.75; color: var(--ink-2); margin: 0; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 16px; }
  .stat { background: var(--surface); padding: 12px 10px 11px; }
  .stat b { display: block; font-size: 22px; font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; line-height: 1; }
  body.night .stat b { color: var(--gold); }
  .stat b small { font-size: 12px; font-weight: 600; margin-left: 2px; }
  .stat span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 5px; }

  .chain { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
  .chain-step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
  .chain-step .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--teal); color: var(--gold); position: relative; }
  body.night .chain-step .dot { background: var(--gold); color: var(--teal); }
  .chain-step:not(:last-child) .dot::after { content: ""; position: absolute; top: 30px; left: 13px; width: 2px; height: 30px; background: var(--line); }
  .chain-step .txt { padding: 3px 0 18px; }
  .chain-step .txt b { font-size: 13.5px; font-weight: 600; display: block; }
  .chain-step .txt span { font-size: 12px; color: var(--muted); display: block; margin-top: 2px; line-height: 1.5; }
  .chain-step:hover .txt b { color: var(--green); }
  body.night .chain-step:hover .txt b { color: var(--gold); }

  .zone-list { display: flex; flex-direction: column; gap: 8px; }
  .zone-item {
    display: grid; grid-template-columns: 34px 1fr 16px; gap: 12px; align-items: center;
    width: 100%; text-align: left; cursor: pointer;
    padding: 11px 12px; border-radius: 8px;
    background: var(--surface-2); border: 1px solid transparent;
    transition: border-color .15s, transform .15s;
  }
  .zone-item:hover, .zone-item.hl { border-color: var(--gold); transform: translateX(2px); }
  .zone-item .no { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; background: var(--teal); color: var(--gold); font-weight: 700; font-size: 15px; }
  body.night .zone-item .no { background: var(--gold); color: var(--teal); }
  .zone-item .zh { font-size: 14px; font-weight: 600; }
  .zone-item .en { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .zone-item .arr { color: var(--muted); font-size: 14px; }

  .principles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .principle { padding: 12px; border-radius: 8px; border: 1px solid var(--line); }
  .principle .ic { width: 26px; height: 26px; color: var(--green); }
  body.night .principle .ic { color: var(--gold); }
  .principle b { display: block; font-size: 13px; margin-top: 6px; }
  .principle span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 3px; }

  .note { font-size: 11px; color: var(--muted); margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); line-height: 1.6; }

  /* detail view */
  .back { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 6px 10px 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
  .back:hover { border-color: var(--gold); }
  .d-head { display: grid; grid-template-columns: 46px 1fr; gap: 14px; align-items: center; margin-top: 18px; }
  .d-head .no { width: 46px; height: 46px; border-radius: 9px; display: grid; place-items: center; background: var(--teal); color: var(--gold); font-weight: 700; font-size: 21px; }
  body.night .d-head .no { background: var(--gold); color: var(--teal); }
  .d-head h2 { margin: 0; font-size: 21px; line-height: 1.25; }
  .d-head .en { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .tagline { margin: 16px 0 0; padding: 12px 14px; border-left: 3px solid var(--gold); background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 14px; font-weight: 500; line-height: 1.6; }
  .spec-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .spec-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 8px 0; width: 38%; border-bottom: 1px solid var(--line); vertical-align: top; }
  .spec-table td { padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 500; }
  .fac { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .fac li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
  .fac li::before { content: ""; width: 8px; height: 8px; margin-top: 7px; border-radius: 2px; background: var(--green); transform: rotate(45deg); }
  body.night .fac li::before { background: var(--gold); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--line); }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
  .pager button { text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer; }
  .pager button:last-child { text-align: right; }
  .pager button:hover:not(:disabled) { border-color: var(--gold); }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager small { display: block; font-size: 11px; color: var(--muted); }
  .pager b { display: block; font-size: 13px; font-weight: 600; margin-top: 2px; }

  /* ---------------- Stage ---------------- */
  #stage { order: 1; position: relative; flex: 1 1 auto; height: 100%; overflow: hidden; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  #scene.hovering { cursor: pointer; }
  #leaders { position: absolute; inset: 0; pointer-events: none; }
  #pins { position: absolute; inset: 0; pointer-events: none; }

  .pin {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: center; gap: 7px;
    padding: 4px 10px 4px 4px;
    background: var(--hud);
    border: 1px solid var(--line);
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 2px 10px rgba(15, 42, 46, .12);
    transition: opacity .2s, background .2s;
    will-change: transform;
    pointer-events: auto; cursor: pointer;
  }
  .pin .n { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; background: var(--teal); color: var(--gold); font-weight: 700; font-size: 12px; flex: 0 0 auto; }
  body.night .pin .n { background: var(--gold); color: var(--teal); }
  .pin .l { line-height: 1.15; }
  .pin b { display: block; font-size: 12.5px; font-weight: 600; }
  .pin span { display: block; font-size: 10px; color: var(--muted); letter-spacing: .02em; }
  .pin.dim { opacity: .3; }
  .pin.sel { background: var(--teal); color: #F4EFE4; border-color: var(--teal); }
  .pin.sel span { color: rgba(244,239,228,.7); }
  .pin.sel .n { background: var(--gold); color: var(--teal); }
  body.night .pin.sel { background: var(--gold); color: var(--teal); border-color: var(--gold); }
  body.night .pin.sel span { color: rgba(15,42,46,.7); }
  body.night .pin.sel .n { background: var(--teal); color: var(--gold); }
  .pin.hidden { display: none; }

  #card {
    position: absolute; left: 0; top: 0; z-index: 10;
    width: 260px; max-width: calc(100% - 32px);
    padding: 11px 13px 12px;
    background: var(--hud);
    border: 1px solid var(--line);
    border-top: 3px solid var(--gold);
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(15, 42, 46, .22);
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    backdrop-filter: blur(6px);
  }
  #card.show { opacity: 1; }
  #card .top { display: flex; align-items: center; gap: 8px; }
  #card .n { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; background: var(--teal); color: var(--gold); font-weight: 700; font-size: 12px; }
  body.night #card .n { background: var(--gold); color: var(--teal); }
  #card .zh { font-size: 15px; font-weight: 700; }
  #card .en { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  #card .use { margin-top: 7px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
  #card .cta { margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--green); }
  body.night #card .cta { color: var(--gold); }

  .hud {
    position: absolute; z-index: 5;
    background: var(--hud);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(6px);
  }
  #controls { right: 16px; top: 16px; padding: 5px; display: flex; gap: 5px; }
  #controls button {
    font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
    background: transparent; color: var(--ink);
    white-space: nowrap;
  }
  #controls button:hover { border-color: var(--gold); }
  #controls button.primary { background: var(--teal); color: #F4EFE4; }
  body.night #controls button.primary { background: var(--gold); color: var(--teal); }
  #controls button[aria-pressed="true"].toggle { background: var(--surface-2); }
  #controls button.toggle[aria-pressed="false"] { opacity: .55; }
  #controls .sep { width: 1px; background: var(--line); margin: 4px 2px; }

  #hint { left: 16px; bottom: 16px; padding: 7px 12px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  #legend { left: 16px; top: 16px; padding: 9px 12px; font-size: 11.5px; color: var(--ink-2); display: grid; gap: 5px; }
  #legend div { display: flex; align-items: center; gap: 8px; }
  #legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: 0 0 auto; }
  #compass { right: 16px; bottom: 16px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
  #compass svg { width: 44px; height: 44px; }
  #tourBar { left: 50%; top: 16px; transform: translateX(-50%); padding: 7px 14px; font-size: 12.5px; font-weight: 600; display: none; align-items: center; gap: 10px; }
  #tourBar.show { display: flex; }
  #tourBar .prog { width: 90px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #tourBar .prog i { display: block; height: 100%; width: 0; background: var(--gold); }

  #error { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 16px; font-size: 14px; }

  @media (max-width: 1100px) { #legend { display: none; } }
  @media (max-width: 820px) {
    body { flex-direction: column; }
    #stage { order: 0; height: auto; flex: 1 1 auto; min-height: 0; }
    #panel { order: 1; width: 100%; flex: 0 0 auto; height: auto; max-height: 64px; border-right: 0; border-top: 1px solid var(--line); transition: max-height .3s ease, background .6s; }
    #panel.open { max-height: 52vh; }
    .brand { padding: 12px 16px; }
    .brand svg { width: 30px; height: 30px; }
    .brand .t1 { font-size: 16px; }
    .brand .t2 { font-size: 11px; }
    .brand .sheet-toggle { display: block; }
    #panelBody { padding: 0 16px 24px; }
    #hint { display: none; }
    #controls { left: 12px; right: 12px; top: 12px; justify-content: center; flex-wrap: wrap; }
    #controls button { padding: 6px 9px; font-size: 12px; }
    #compass { right: 12px; bottom: 12px; width: 46px; height: 46px; }
    #compass svg { width: 36px; height: 36px; }
    #tourBar { top: 62px; }
    .pin span { display: none; }
    .pin b { font-size: 11px; }
  }
</style>
</head>
<body>

<aside id="panel" aria-label="園區介紹">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#E0A43A" stroke-width="2"/>
      <path d="M20 30 C 11 26, 11 15, 20 9 C 29 15, 29 26, 20 30 Z" fill="#17775A"/>
      <path d="M20 29 L20 13" stroke="#E0A43A" stroke-width="1.6"/>
      <path d="M20 22 L15.5 18 M20 18 L24 15" stroke="#E0A43A" stroke-width="1.3"/>
    </svg>
    <div>
      <div class="t1">BTRDCC</div>
      <div class="t2">生物科技園區 · Biotech Campus</div>
    </div>
    <button class="sheet-toggle" id="sheetToggle" type="button" aria-expanded="false">簡介 ▲</button>
  </div>
  <div id="panelBody"></div>
</aside>

<main id="stage">
  <canvas id="scene" aria-label="BTRDCC 園區 3D 模型"></canvas>
  <canvas id="leaders"></canvas>
  <div id="pins"></div>
  <div id="card" role="tooltip" aria-hidden="true"></div>

  <div id="legend" class="hud" aria-hidden="true">
    <div><i style="background:#0F2A2E"></i>研發及辦公</div>
    <div><i style="background:#ece6d8;border:1px solid #17775A"></i>實驗設施</div>
    <div><i style="background:#cfd6d2"></i>生產廠房</div>
    <div><i style="background:#8fbf5a"></i>農業試驗</div>
    <div><i style="background:#E0A43A"></i>地標及重點</div>
  </div>
  <div id="controls" class="hud">
    <button id="btnDayNight" class="primary" type="button" aria-pressed="false">🌙 夜間</button>
    <button id="btnTour" type="button">▶ 導覽</button>
    <span class="sep"></span>
    <button id="btnPins" class="toggle" type="button" aria-pressed="true">標籤</button>
    <button id="btnMotion" class="toggle" type="button" aria-pressed="true">動態</button>
    <button id="btnReset" type="button">重設視角</button>
  </div>
  <div id="tourBar" class="hud"><span id="tourText">導覽中</span><span class="prog"><i id="tourProg"></i></span></div>
  <div id="hint" class="hud">拖曳旋轉 · 滾輪縮放 · 右鍵／Shift 拖曳平移 · 點擊建築查看詳情</div>
  <div id="compass" class="hud" title="指北">
    <svg viewBox="-22 -22 44 44" aria-hidden="true">
      <g id="needle">
        <polygon points="0,-17 5,0 0,-3 -5,0" fill="#E0A43A"/>
        <polygon points="0,17 5,0 0,3 -5,0" fill="currentColor" opacity=".3"/>
        <text x="0" y="-17.5" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" font-family="Inter, sans-serif" dy="-1">N</text>
      </g>
    </svg>
  </div>
  <div id="error">無法載入 Three.js，請檢查網絡連線後重新整理。</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    night = n;
    document.body.classList.toggle('night', n);
    btnDN.textContent = n ? '☀️ 日間' : '🌙 夜間';
    btnDN.setAttribute('aria-pressed', String(n));
  }
  function applyDayNight(t) {
    scene.background.copy(DAY_BG).lerp(NIGHT_BG, t);
    sun.intensity = THREE.MathUtils.lerp(1.6, 0.26, t);
    sun.color.setHex(0xfff1dc).lerp(new THREE.Color(0x9fb8ff), t);
    hemi.intensity = THREE.MathUtils.lerp(0.72, 0.22, t);
    hemi.color.setHex(0xfffaf0).lerp(new THREE.Color(0x6c86a8), t);
    hemi.groundColor.setHex(0xcfc4ad).lerp(new THREE.Color(0x1a2224), t);
    fill.intensity = THREE.MathUtils.lerp(0.32, 0.1, t);
    nightMats.forEach(n => n.mat.emissiveIntensity = n.intensity * t);
    nightLights.forEach(n => n.light.intensity = n.intensity * t);
    dayNightColor.forEach(d => d.mat.color.copy(d.day).lerp(d.night, t));
    EDGE.opacity = THREE.MathUtils.lerp(0.32, 0.4, t);
    renderer.toneMappingExposure = THREE.MathUtils.lerp(1.05, 1.25, t);
  }
  btnDN.addEventListener('click', () => setNight(!night));

  const btnTour = document.getElementById('btnTour');
  const tourBar = document.getElementById('tourBar');
  const tourText = document.getElementById('tourText');
  const tourProg = document.getElementById('tourProg');
  const TOUR_MS = 6500;
  let tour = null;
  function startTour() {
    tour = { i: -1, t0: 0 };
    btnTour.textContent = '■ 停止';
    tourBar.classList.add('show');
    nextTourStop();
  }
  function nextTourStop() {
    if (!tour) return;
    tour.i = (tour.i + 1) % zones.length;
    tour.t0 = performance.now();
    const z = zones[tour.i];
    selected = null;
    select(z, false);
    flyTo({ az: view.az + 0.55, polar: 0.92, zoom: z.focusZoom * (isMobile() ? 0.8 : 1), target: z.center.clone() }, 1600);
    tourText.textContent = '導覽 ' + z.no + ' / ' + zones.length + ' · ' + z.zh;
  }
  function stopTour() {
    if (!tour) return;
    tour = null;
    btnTour.textContent = '▶ 導覽';
    tourBar.classList.remove('show');
  }
  btnTour.addEventListener('click', () => tour ? stopTour() : startTour());

  document.getElementById('btnReset').addEventListener('click', () => {
    stopTour();
    selected = null; refreshOutlines(); renderOverview();
    flyTo({ az: DEFAULT.az, polar: DEFAULT.polar, zoom: DEFAULT.zoom, target: DEFAULT.target.clone() });
  });
  const btnPins = document.getElementById('btnPins');
  btnPins.addEventListener('click', () => { showPins = !showPins; btnPins.setAttribute('aria-pressed', String(showPins)); });
  let motion = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const btnMotion = document.getElementById('btnMotion');
  btnMotion.setAttribute('aria-pressed', String(motion));
  btnMotion.addEventListener('click', () => { motion = !motion; btnMotion.setAttribute('aria-pressed', String(motion)); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { stopTour(); select(null); }
  });

  // ===========================================================================
  // Loop
  // ===========================================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    stepTween(now);
    const target = night ? 1 : 0;
    if (tNight !== target) {
      tNight += (target - tNight) * 0.1;
      if (Math.abs(target - tNight) < 0.002) tNight = target;
      applyDayNight(tNight);
    }
    if (motion) updateCars(dt);
    if (tour) {
      const k = (now - tour.t0) / TOUR_MS;
      tourProg.style.width = Math.min(100, k * 100) + '%';
      if (k >= 1) nextTourStop();
    }
    renderer.render(scene, camera);
    layoutPins();
    requestAnimationFrame(frame);
  }

  window.__campus = {
    setNight, select: id => select(id ? Z(id) : null, true), zones: () => zones.map(z => z.id),
    screenOf: id => { const z = Z(id); tmp.copy(z.anchor).project(camera); return { x: (tmp.x + 1) / 2 * SW, y: (1 - tmp.y) / 2 * SH }; },
    rotate: (daz, dpolar, zoom) => { tween = null; view.az += daz || 0; view.polar = THREE.MathUtils.clamp(view.polar + (dpolar || 0), 0.18, 1.35); if (zoom) view.zoom = zoom; applyCamera(); },
    startTour, stopTour
  };
  resize();
  applyCamera();
  applyDayNight(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
